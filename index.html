<title>Visor de Ebook</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.viewer{
max-width:1200px;
margin:auto;
}

.toolbar{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

button{
padding:10px 15px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

#pageInfo{
font-weight:bold;
}

.image-wrapper{
position:relative;
text-align:center;
}

#mainImage{
max-width:100%;
height:auto;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
transition:.3s;
}

.watermark{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) rotate(-25deg);
font-size:48px;
font-weight:bold;
color:rgba(255,0,0,.10);
pointer-events:none;
white-space:nowrap;
}

.thumbnails{
display:flex;
justify-content:center;
gap:10px;
margin-top:20px;
flex-wrap:wrap;
}

.thumb{
width:100px;
cursor:pointer;
border:3px solid transparent;
border-radius:8px;
}

.thumb.active{
border-color:#2563eb;
}

</style>

</head>
