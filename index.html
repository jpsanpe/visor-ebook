<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visor Ebook</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f5f5f5;
    font-family:Arial,sans-serif;
}

.viewer{
    max-width:1200px;
    margin:auto;
}

.toolbar{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#pageInfo{
    font-weight:bold;
}

.image-wrapper{
    position:relative;
    text-align:center;
}

#mainImage{
    max-width:100%;
    height:auto;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    transition:all .3s;
}

.watermark{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) rotate(-25deg);
    font-size:48px;
    font-weight:bold;
    color:rgba(255,0,0,.10);
    pointer-events:none;
    white-space:nowrap;
}

.thumbnails{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.thumb{
    width:90px;
    cursor:pointer;
    border:3px solid transparent;
    border-radius:6px;
}

.thumb.active{
    border-color:#2563eb;
}

</style>
</head>

<body>

<div class="viewer">

    <div class="toolbar">
        <button onclick="prevPage()">⬅ Anterior</button>

        <span id="pageInfo">
            Página 1
        </span>

        <button onclick="nextPage()">Siguiente ➡</button>

        <button onclick="zoomOut()">➖</button>

        <button onclick="zoomIn()">➕</button>
    </div>

    <div class="image-wrapper">

        <img id="mainImage" src="">

        <div class="watermark">
            USO EXCLUSIVO
        </div>

    </div>

    <div id="thumbContainer" class="thumbnails"></div>

</div>

<script>

/* ==================================================== */
/* SOLO CAMBIA LAS URLS DE ABAJO                        */
/* ==================================================== */

const paginas = [

"https://d1yei2z3i6k35z.cloudfront.net/18537462/6aea3b0e472483.20274727_Perakawaiiconhojaverde.png",

"https://d1yei2z3i6k35z.cloudfront.net/18537462/6aea3b3c1ec3d6.12735978_Laperaunafrutamaravillosa.png",

"https://d1yei2z3i6k35z.cloudfront.net/18537462/6aea3b5bb45e05.85166898_COmidapera.jpg"

];

/* ==================================================== */
/* NO TOCAR NADA DEBAJO DE ESTA LINEA                   */
/* ==================================================== */

let paginaActual = 0;
let zoom = 100;

const imagen = document.getElementById("mainImage");

function renderPage(){

    imagen.src = paginas[paginaActual];

    document.getElementById("pageInfo").innerText =
        "Página " +
        (paginaActual + 1) +
        " de " +
        paginas.length;

    document
        .querySelectorAll(".thumb")
        .forEach((thumb,index)=>{

            thumb.classList.remove("active");

            if(index===paginaActual){
                thumb.classList.add("active");
            }

        });

}

function nextPage(){

    if(paginaActual < paginas.length - 1){

        paginaActual++;

        renderPage();

    }

}

function prevPage(){

    if(paginaActual > 0){

        paginaActual--;

        renderPage();

    }

}

function zoomIn(){

    zoom += 10;

    imagen.style.width = zoom + "%";

}

function zoomOut(){

    if(zoom > 50){

        zoom -= 10;

        imagen.style.width = zoom + "%";

    }

}

const miniaturas =
document.getElementById("thumbContainer");

paginas.forEach((url,index)=>{

    const thumb =
    document.createElement("img");

    thumb.src = url;

    thumb.className = "thumb";

    thumb.addEventListener("click",function(){

        paginaActual = index;

        renderPage();

    });

    miniaturas.appendChild(thumb);

});

renderPage();

document.addEventListener(
    "contextmenu",
    function(e){
        e.preventDefault();
    }
);

</script>

</body>
</html>
